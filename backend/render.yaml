# Render Blueprint for FastAPI backend
services:
  - type: web
    name: guard-my-bills-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: PORT
        value: 10000
    autoDeploy: true
    healthCheckPath: /health
